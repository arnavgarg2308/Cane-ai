
# Application
spring.application.name=smartsugar-backend

# Database connection
spring.datasource.url=jdbc:postgresql://localhost:5432/smartsugar_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA and Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080
# ===================================
# Excel Upload Configuration
# ===================================

spring.servlet.multipart.enabled=true

# Maximum individual Excel file size
spring.servlet.multipart.max-file-size=25MB

# Maximum complete HTTP request size
spring.servlet.multipart.max-request-size=27MB

# Files larger than this threshold can use temporary disk storage
spring.servlet.multipart.file-size-threshold=2MB

# Application-level upload limit (25 MB)
app.upload.max-file-size-bytes=26214400

